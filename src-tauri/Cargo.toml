[package]
name = "sublore"
version = "0.1.0"
description = "Translation memory for subtitles"
edition = "2021"
license = "GPL-3.0-or-later"

# Integration tests can only reach a library target, so the app is a thin shim over a lib.
# The lib name differs from the bin name to avoid the Windows artifact collision.
[lib]
name = "sublore_lib"
path = "src/lib.rs"

[[bin]]
name = "sublore"
path = "src/main.rs"

# libtest runs every #[test] on a thread it spawns, so the main-thread crash path needs a target
# without a harness: there, `main` really is the process main thread.
[[test]]
name = "crash_main_thread"
path = "tests/crash_main_thread.rs"
harness = false

[features]
# Tests that need a real ffmpeg and the generated waveform fixtures, mirroring the feature of the
# same name in sublore-audio. Off by default, so on a machine without them there is no test to
# skip: there is no test at all. Run `sh fixtures/video/make-waveform-fixtures.sh` first.
real-media = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
libmpv2 = { version = "6.0.0", default-features = false }
serde = { version = "1", features = ["derive"] }
# The remembered chooser folders on disk. Already in the tree through tauri, MIT/Apache-2.0, and it
# escapes what a hand-rolled line format would corrupt: a Linux path may contain a newline.
serde_json = "1"
sublore-asr = { path = "../crates/sublore-asr" }
sublore-audio = { path = "../crates/sublore-audio" }
sublore-edit = { path = "../crates/sublore-edit" }
sublore-formats = { path = "../crates/sublore-formats" }
sublore-io = { path = "../crates/sublore-io" }
sublore-matcher = { path = "../crates/sublore-matcher" }
sublore-project = { path = "../crates/sublore-project" }
sublore-module-api = { path = "../crates/sublore-module-api" }
sublore-module-host = { path = "../crates/sublore-module-host" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"

[dev-dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gdkx11 = "0.18"
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }
