[package]
name = "sublore"
version = "0.1.0"
description = "Translation memory for subtitles"
edition = "2021"
license = "GPL-3.0-or-later"

# Integration tests can only reach a library target, so the app is a thin shim over a lib.
# The lib name differs from the bin name to avoid the Windows artifact collision.
[lib]
name = "sublore_lib"
path = "src/lib.rs"

[[bin]]
name = "sublore"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
libmpv2 = { version = "6.0.0", default-features = false }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[dev-dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gdkx11 = "0.18"
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }
