[package]
name = "sublore-audio"
version = "0.1.0"
description = "Waveform peaks: decode one audio track with ffmpeg and fold it into millisecond buckets"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[features]
# Tests that need a real ffmpeg and the generated waveform fixtures. Off by default, so on a
# machine without them there is no test to skip: there is no test at all. Run them with
# `sh fixtures/video/make-waveform-fixtures.sh` first. See BACKLOG.md M2.4.
real-media = []

# ffmpeg is a child process, not a linked library, so nothing here is for the extraction. Both are
# the cache's (BACKLOG.md M2.4 W3).
[dependencies]
# The cache key is a hash of the source's own bytes (decision 20). Already in the tree through
# sublore-asr's model catalog, RustCrypto, MIT/Apache-2.0.
sha2 = "0.11"
# Temp file, fsync, rename: the one atomic write path in the repository (CONTRIBUTING.md §3.2).
# It has no dependencies of its own, so this adds nothing else and closes no cycle.
sublore-io = { path = "../sublore-io" }
