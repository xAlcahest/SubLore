[package]
name = "sublore-project"
version = "0.1.0"
description = "Sublore project database: schema, versioned migrations, episodes and their files"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

# The one dependency the core crates carry. CONTRIBUTING.md §2 fixes SQLite as the storage engine, and
# Rust cannot reach a C library without a binding; `bundled` compiles SQLite from source so no
# platform needs a system library. See BACKLOG.md M4.1.
[dependencies]
# `hooks` is `hooks = []` in rusqlite's own manifest, so it pulls no new dependency and only
# compiles more of a crate the workspace already builds. It is what `module_guard` needs.
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "hooks"] }
