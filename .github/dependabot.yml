# Dependabot: one weekly pass per ecosystem, grouped so a quiet week costs one pull request,
# not eight. Every update lands on `pull_request`, so CI (both runners) gates it like any change.
version: 2
updates:
  # The workflow pins actions by major tag; `dtolnay/rust-toolchain@stable` is a branch and is
  # left alone. The Rust compiler itself is pinned in rust-toolchain.toml, by hand, on purpose.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  # One entry covers the whole workspace: the six crates plus src-tauri share Cargo.lock.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
