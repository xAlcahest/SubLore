name: CI

# Triggers, owner ruling 2026-08-31. Task branches never build: a push to a branch nobody has
# opened a pull request for is work in progress, and a red mark on it is noise, not information.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# One run per pull request. Four runs of the same branch raced each other while this was being
# fixed, and three of them were answering a question already superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows on every event Linux runs on, pull requests included (owner ruling 2026-08-31).
        # It only compiles there — no behaviour has ever been run on Windows — but a compile that
        # breaks is worth knowing about before a merge, not after.
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Tauri 2 build dependencies plus libmpv and ffmpeg for the video fixture. See README.md.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            ffmpeg \
            file \
            libayatana-appindicator3-dev \
            libmpv-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Install libmpv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag  = "20260814"
          $file = "mpv-dev-x86_64-20260814-git-7b8915bc1d.7z"
          $sha  = "0af22b28e920620036d3ae08fd9283156dc9af0420bf4df84b0e02282094599c"
          $dir  = "$env:RUNNER_TEMP\mpv-dev"
          Invoke-WebRequest -Uri "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/$tag/$file" -OutFile mpv-dev.7z
          if ((Get-FileHash mpv-dev.7z -Algorithm SHA256).Hash -ne $sha.ToUpper()) { throw "libmpv archive checksum mismatch" }
          7z x mpv-dev.7z -o"$dir" | Out-Null

          # MSVC import library: the archive ships only a MinGW .dll.a, so build mpv.lib from the DLL exports.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs    = & $vswhere -latest -products * -property installationPath
          $tools = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64" | Select-Object -Last 1
          $dumpbin = Join-Path $tools.FullName "dumpbin.exe"
          $libexe  = Join-Path $tools.FullName "lib.exe"
          $names = & $dumpbin /exports "$dir\libmpv-2.dll" |
            Select-String -Pattern '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]{8}\s+(mpv_\S+)' |
            ForEach-Object { $_.Matches[0].Groups[1].Value }
          if ($names.Count -lt 50) { throw "expected at least 50 mpv_* exports, found $($names.Count)" }
          if ($names -notcontains "mpv_create") { throw "mpv_create missing from libmpv-2.dll exports" }
          @("EXPORTS") + $names | Set-Content "$dir\mpv.def"
          & $libexe /def:"$dir\mpv.def" /name:libmpv-2.dll /out:"$dir\mpv.lib" /MACHINE:X64
          if (-not (Test-Path "$dir\mpv.lib")) { throw "failed to generate mpv.lib" }

          "LIBMPV_LIB_DIR=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting (frontend)
        run: pnpm format:check

      - name: Lint (frontend)
        run: pnpm lint

      - name: Build frontend
        run: pnpm build

      - name: Check formatting (Rust)
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build Rust
        run: cargo build

      # The video tests need the fixture; it is generated, never committed.
      - name: Generate video fixture
        run: sh fixtures/video/make-sample.sh

      # --no-fail-fast: one target that cannot start must not hide the state of the others. The
      # Windows run of 2026-08-30 stopped at crash_main_thread and told us nothing about the rest.
      # Windows searches the executable's own directory before PATH, so the pinned DLL goes there.
      # Without this the loader is free to find another libmpv-2.dll first, and it did: the three
      # test targets that actually reference mpv symbols died with STATUS_ENTRYPOINT_NOT_FOUND
      # while the unit tests, which reference none, passed (gate 2, run 33366855143).
      - name: Put libmpv beside the test binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path target\debug\deps | Out-Null
          foreach ($to in @("target\debug", "target\debug\deps")) {
            Copy-Item "$env:LIBMPV_LIB_DIR\libmpv-2.dll" $to -Force
          }
          Get-ChildItem target\debug\libmpv-2.dll, target\debug\deps\libmpv-2.dll |
            ForEach-Object { "placed $($_.FullName) ($($_.Length) bytes)" }

      - name: Test Rust
        run: cargo test --workspace --no-fail-fast

      # STATUS_ENTRYPOINT_NOT_FOUND says a dependency is missing a symbol and never says which one.
      - name: Name the missing entry point (Windows, only when the tests failed)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/windows-entrypoint.ps1

  e2e:
    name: e2e smoke (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The `check` job's Tauri/libmpv list, plus what driving a real window under Xvfb needs.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            ffmpeg \
            file \
            libayatana-appindicator3-dev \
            libgl1-mesa-dri \
            libmpv-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            python3-xlib \
            webkit2gtk-driver \
            wget \
            x11-utils \
            xdotool \
            xvfb

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.0.6 --locked

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The harness never builds implicitly; every prerequisite is made here, explicitly.
      - name: Generate video fixture
        run: sh fixtures/video/make-sample.sh

      # The app hashes the model before every run, so the transcription spec needs the real file.
      # The stand-in sidecar never reads it. Downloaded here because CI asked, never by the app.
      - name: Fetch the transcription model
        run: sh scripts/fetch-model.sh

      - name: Build the app
        run: pnpm e2e:build

      - name: Smoke test (window title, video surface)
        continue-on-error: true
        run: .github/scripts/e2e-check.sh smoke e2e

      - name: Shutdown test (clean exit, no survivors)
        continue-on-error: true
        run: .github/scripts/e2e-check.sh shutdown e2e:shutdown

      - name: Close gate test (unsaved edits are never dropped silently)
        continue-on-error: true
        run: .github/scripts/e2e-check.sh close-gate e2e:close-gate

      - name: Late-edit gate test (an edit made while the answer is in flight is asked about again)
        continue-on-error: true
        run: .github/scripts/e2e-check.sh late-edit e2e:close-gate-late-edit

      - name: Startup args test (a name the command line cannot carry costs that name, not the launch)
        continue-on-error: true
        run: .github/scripts/e2e-check.sh startup-args e2e:startup-args
      - name: mpv context test (a gpu-context mpv refuses costs the request, not the app)
        continue-on-error: true
        run: .github/scripts/e2e-check.sh mpv-context e2e:mpv-context

      # The only automated check that catches N2c's fix being removed: every other job misses it
      # because devicePixelRatio is 1 under Xvfb. At GDK_SCALE=2 the window is 2048x1400, larger
      # than the screen, which this bare X server serves without clamping (verified locally).
      - name: Scaled surface test (an integer display scale is applied exactly once)
        continue-on-error: true
        run: .github/scripts/e2e-check.sh scale e2e:scale

      # Two behavioural checks are deliberately not steps here, and this is the record of that
      # decision rather than an oversight (gate 2 register, `package.json:19`, `ci.yml:196`).
      # `pnpm e2e:webview` needs /sys/module/nvidia for the branch it tests to be taken at all; on
      # ubuntu-latest it would assert "not applied" and prove only that llvmpipe paints, which the
      # smoke test above already covers. It runs on the owner's machine, per WORKFLOW.md §4c.
      # `pnpm e2e:wayland` needs a real Wayland socket; without one mpv falls back to X11 and the
      # check would be green for the wrong reason, so it refuses to run instead. Same owner-machine
      # rule. Neither is silently skippable: both fail loudly when their prerequisite is absent.

      # A diagnostic run collects every failure instead of stopping at the first, but it must not
      # end green while a check is red: the artefact is the evidence, this step is the verdict.
      - name: Collect the diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostic-logs
          path: ci-logs/
          if-no-files-found: warn

      # A verdict built on the shape of somebody else's output is a verdict that guesses. The
      # previous one read log text, so it could not tell a check that failed from one that never
      # ran, and a WebdriverIO run that executed no specs read as green. Exit codes say both.
      - name: Verdict (red unless every check ran and returned zero)
        if: always()
        run: .github/scripts/e2e-verdict.sh
          fi
          echo "every check reported success"
