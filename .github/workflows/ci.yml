name: CI

# Triggers, owner ruling 2026-08-31. Task branches never build: a push to a branch nobody has
# opened a pull request for is work in progress, and a red mark on it is noise, not information.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# One run per pull request. Four runs of the same branch raced each other while this was being
# fixed, and three of them were answering a question already superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Without this the default is six hours. On 2026-09-01 apt hung inside "Install Linux system
    # dependencies" and the job sat there while the other six checks had already answered.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Windows on every event Linux runs on, pull requests included (owner ruling 2026-08-31).
        # It only compiles there — no behaviour has ever been run on Windows — but a compile that
        # breaks is worth knowing about before a merge, not after.
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Tauri 2 build dependencies plus libmpv and ffmpeg for the video fixture. See README.md.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            ffmpeg \
            file \
            libayatana-appindicator3-dev \
            libmpv-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      # Moved to a script when the package job below needed the same libmpv (M0.3): two copies of
      # this would have drifted, and the checksum is the half that must not.
      - name: Install libmpv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/install-libmpv-windows.ps1

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting (frontend)
        run: pnpm format:check

      - name: Lint (frontend)
        run: pnpm lint

      - name: Build frontend
        run: pnpm build

      - name: Check formatting (Rust)
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build Rust
        run: cargo build

      # The video tests need the fixture; it is generated, never committed.
      - name: Generate video fixture
        run: sh fixtures/video/make-sample.sh

      # M2.4's acceptance sentence, "silence reads flat and the 440 Hz tone reads full", lives in
      # five tests behind the real-media feature, and CI never enabled it, so it had never been
      # checked here. Linux only: this is behaviour, and the platform policy proves behaviour here.
      - name: Test the peaks against real media (Linux)
        if: runner.os == 'Linux'
        run: |
          sh fixtures/video/make-waveform-fixtures.sh
          cargo test -p sublore-audio --features real-media
          # A feature that stops being passed compiles the file away and leaves a green step behind,
          # which is the shape of the hole this step was added to close. Through a file, not a pipe:
          # `grep -q` closes the pipe on its first match and cargo dies of SIGPIPE, which pipefail
          # then reports as a failure of the step that just succeeded.
          cargo test -p sublore-audio --features real-media -- --list > real-media-list.txt
          grep -q 'the_alternating_fixture_reads_full_where_it_is_a_tone_and_flat_where_it_is_silent' real-media-list.txt ||
            { echo "the test M2.4 is specified against is not in the suite"; exit 1; }

      # --no-fail-fast: one target that cannot start must not hide the state of the others. The
      # Windows run of 2026-08-30 stopped at crash_main_thread and told us nothing about the rest.
      # Windows searches the executable's own directory before PATH, so the pinned DLL goes there.
      # Without this the loader is free to find another libmpv-2.dll first, and it did: the three
      # test targets that actually reference mpv symbols died with STATUS_ENTRYPOINT_NOT_FOUND
      # while the unit tests, which reference none, passed (gate 2, run 33366855143).
      - name: Put libmpv beside the test binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path target\debug\deps | Out-Null
          foreach ($to in @("target\debug", "target\debug\deps")) {
            Copy-Item "$env:LIBMPV_LIB_DIR\libmpv-2.dll" $to -Force
          }
          Get-ChildItem target\debug\libmpv-2.dll, target\debug\deps\libmpv-2.dll |
            ForEach-Object { "placed $($_.FullName) ($($_.Length) bytes)" }

      - name: Test Rust
        run: cargo test --workspace --no-fail-fast

      # STATUS_ENTRYPOINT_NOT_FOUND says a dependency is missing a symbol and never says which one.
      - name: Name the missing entry point (Windows, only when the tests failed)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/windows-entrypoint.ps1

  e2e:
    name: e2e smoke (ubuntu)
    runs-on: ubuntu-latest
    # The longest job here: 16 minutes measured on 2026-09-01, and every check inside it has its own
    # wait. This is the backstop for a runner that stops answering, not a budget for the suite.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The `check` job's Tauri/libmpv list, plus what driving a real window under Xvfb needs.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            elfutils \
            ffmpeg \
            file \
            libayatana-appindicator3-dev \
            libgl1-mesa-dri \
            libmpv-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            python3-xlib \
            webkit2gtk-driver \
            wget \
            x11-utils \
            xdotool \
            xvfb

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.0.6 --locked

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Every app launch here waited 30 s before it ran a line of its own, and that is 60 per cent
      # of this job. The runner declares org.freedesktop.portal.Desktop activatable through
      # libwebkit2gtk-4.1-dev's dependencies and has no session that can start it, so GtkApplication
      # waits out a D-Bus timeout before the window exists. Measured in one job on 2026-09-03: the
      # same check is 0m02s with this file moved aside and 0m31s with it in place. Moved rather than
      # purged: the build needs the package it belongs to. See BACKLOG.md N10.
      - name: Take away the portal nothing here can start
        run: sudo mv /usr/share/dbus-1/services/org.freedesktop.portal.Desktop.service /tmp/portal.service.away

      # The harness never builds implicitly; every prerequisite is made here, explicitly.
      - name: Generate video fixture
        run: sh fixtures/video/make-sample.sh

      # waveform.spec.js reads the peaks of a file whose audio is known. Generated, never committed.
      - name: Generate waveform fixtures
        run: sh fixtures/video/make-waveform-fixtures.sh

      # The app hashes the model before every run, so the transcription spec needs the real file.
      # The stand-in sidecar never reads it. Downloaded here because CI asked, never by the app.
      - name: Fetch the transcription model
        run: sh scripts/fetch-model.sh

      - name: Build the app
        run: pnpm e2e:build

      - name: Smoke test (window title, video surface)
        continue-on-error: true
        timeout-minutes: 25
        run: .github/scripts/e2e-check.sh smoke e2e

      - name: Shutdown test (clean exit, no survivors)
        continue-on-error: true
        timeout-minutes: 3
        run: .github/scripts/e2e-check.sh shutdown e2e:shutdown

      - name: Close gate test (unsaved edits are never dropped silently)
        continue-on-error: true
        timeout-minutes: 4
        run: .github/scripts/e2e-check.sh close-gate e2e:close-gate

      - name: Late-edit gate test (an edit made while the answer is in flight is asked about again)
        continue-on-error: true
        timeout-minutes: 4
        run: .github/scripts/e2e-check.sh late-edit e2e:close-gate-late-edit

      - name: Quit gate test (a quit that is not a window close asks the same question)
        continue-on-error: true
        timeout-minutes: 6
        run: .github/scripts/e2e-check.sh quit-gate e2e:quit-gate

      - name: Startup args test (a name the command line cannot carry costs that name, not the launch)
        continue-on-error: true
        timeout-minutes: 4
        run: .github/scripts/e2e-check.sh startup-args e2e:startup-args
      - name: mpv context test (a gpu-context mpv refuses costs the request, not the app)
        continue-on-error: true
        timeout-minutes: 3
        run: .github/scripts/e2e-check.sh mpv-context e2e:mpv-context

      # The one check that must not have a display, so it cannot go through e2e-check.sh: that
      # wrapper hands every check an X server through xvfb-run. It leaves the same log and exit
      # code the verdict reads. `|| status=$?` because the step's shell is `bash -e`, which would
      # otherwise abandon the step at the failure, before the exit file is written.
      - name: No-display test (a launch with nowhere to draw is a message, not a panic)
        continue-on-error: true
        timeout-minutes: 2
        run: |
          mkdir -p ci-logs
          status=0
          pnpm e2e:no-display > ci-logs/no-display.log 2>&1 || status=$?
          cat ci-logs/no-display.log
          echo "$status" > ci-logs/no-display.exit
          exit "$status"

      # eu-stack has to ptrace the app, and it is the app's sibling under Node, which Ubuntu's Yama
      # default forbids. The check refuses to run rather than report a clean process without this.
      # continue-on-error, like the checks: a sysctl that fails must cost this check its own red
      # mark through its own message, not skip the steps that come after it.
      - name: Allow eu-stack to read the app's threads
        continue-on-error: true
        run: sudo sysctl -w kernel.yama.ptrace_scope=0

      - name: Picker thread test (choosing a path starts no second GTK thread)
        continue-on-error: true
        timeout-minutes: 4
        run: .github/scripts/e2e-check.sh picker-thread e2e:picker-thread

      # The only automated check that catches N2c's fix being removed: every other job misses it
      # because devicePixelRatio is 1 under Xvfb. At GDK_SCALE=2 the window is 2048x1400, larger
      # than the screen, which this bare X server serves without clamping (verified locally).
      # The first of CONTRIBUTING.md section 7's two waveform numbers. The 24-minute one is the
      # owner's machine's: a runner is not the machine that budget names.
      - name: Waveform budget test (peaks on screen inside two seconds)
        continue-on-error: true
        timeout-minutes: 5
        run: .github/scripts/e2e-check.sh waveform-budget e2e:waveform-budget

      - name: Scaled surface test (an integer display scale is applied exactly once)
        continue-on-error: true
        timeout-minutes: 4
        run: .github/scripts/e2e-check.sh scale e2e:scale

      # Two behavioural checks are deliberately not steps here, and this is the record of that
      # decision rather than an oversight (gate 2 register, `package.json:19`, `ci.yml:196`).
      # `pnpm e2e:webview` needs /sys/module/nvidia for the branch it tests to be taken at all; on
      # ubuntu-latest it would assert "not applied" and prove only that llvmpipe paints, which the
      # smoke test above already covers. It runs on the owner's machine.
      # `pnpm e2e:wayland` needs a real Wayland socket; without one mpv falls back to X11 and the
      # check would be green for the wrong reason, so it refuses to run instead. Same owner-machine
      # rule. Neither is silently skippable: both fail loudly when their prerequisite is absent.

      # WebDriver forwards the app's stderr and drops its stdout, so the log the app writes about
      # itself never reached CI and a failing check could only be read from the outside. Every
      # harness gives the app a data home of its own under the temp directory, so there is one log
      # directory per harness rather than one for the job, and each is taken here under its own
      # number with the path it came from written beside it.
      - name: Take the log the app writes about itself
        if: always()
        run: |
          mkdir -p ci-logs/app-log
          found=0
          for logs in "${TMPDIR:-/tmp}"/sublore-*/com.sublore.app/logs \
            "${XDG_DATA_HOME:-$HOME/.local/share}/com.sublore.app/logs"; do
            [ -d "$logs" ] || continue
            found=$((found + 1))
            cp -r "$logs" "ci-logs/app-log/$found"
            echo "$found $logs" >> ci-logs/app-log/where-each-came-from.txt
          done
          echo "app log directories collected: $found"

      # A diagnostic run collects every failure instead of stopping at the first, but it must not
      # end green while a check is red: the artefact is the evidence, this step is the verdict.
      - name: Collect the diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostic-logs
          path: ci-logs/
          if-no-files-found: warn

      # A verdict built on the shape of somebody else's output is a verdict that guesses. The
      # previous one read log text, so it could not tell a check that failed from one that never
      # ran, and a WebdriverIO run that executed no specs read as green. Exit codes say both.
      # Not always(): a run the concurrency group cancelled reaches here with no check reported and
      # turns the job red, so a superseded run reads as a failure. A cancellation is not a verdict.
      - name: Verdict (red unless every check ran and returned zero)
        if: ${{ !cancelled() }}
        run: .github/scripts/e2e-verdict.sh

  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A release build of the workspace and two bundlers, on runners the check job takes 30 minutes
    # on. Like every job here it carries its own: the default is six hours.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Windows builds the installers and stops there. Nothing has ever run one, so an msi from
        # this job is a file that exists, not an install that works; MW.3 is where that is answered.
        # A file nobody runs is not worth a release build on every pull request, so on a pull
        # request only Linux packages, which is the half the smoke below actually starts.
        # Pinned rather than ubuntu-latest: an AppImage starts only on the glibc it was built
        # against or newer, so this must not drift away from the smoke job's container tag.
        # Built on glibc 2.43 and started on 24.04 it dies before main (measured 2026-09-02).
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-24.04"]') || fromJSON('["ubuntu-24.04", "windows-latest"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The check job's list without ffmpeg, which only the video fixture needs. librsvg2-dev is
      # not optional here: the AppImage's gtk plugin reads librsvg-2.0.pc and fails the bundle
      # without it.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libmpv-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Install libmpv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/install-libmpv-windows.ps1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # APPIMAGE_EXTRACT_AND_RUN: linuxdeploy is itself an AppImage and mounts itself with FUSE,
      # which a runner does not have. Without this the deb builds and the AppImage step dies on
      # "failed to run linuxdeploy" (measured on Linux, 2026-09-02).
      - name: Build the Linux installers
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: pnpm tauri build --bundles deb,appimage

      - name: Build the Windows installers
        if: runner.os == 'Windows'
        run: pnpm tauri build --bundles msi,nsis

      # if-no-files-found: error, because a packaging job that uploads nothing and reports success
      # is the one outcome worse than a red one.
      - name: Upload the Linux installers
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: linux-installers
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload the Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-installers
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # M0.3's acceptance criterion, the half that can be automated today: an artifact this workflow
  # built installs somewhere clean and the app it installs comes up. The Windows half of that
  # criterion belongs to MW.3, by hand, on a machine nobody has yet.
  package-smoke:
    name: package smoke (ubuntu)
    needs: package
    runs-on: ubuntu-latest
    # Two downloads, a handful of packages and two launches. Nothing here compiles.
    timeout-minutes: 20
    # A clean image rather than the runner: the runner already carries most of what the .deb has to
    # declare, so a dependency it forgot would install and start there and fail on a user's machine.
    # This tag and the packaging job's ubuntu-24.04 are one decision: see the comment there.
    container: ubuntu:24.04
    steps:
      # The image carries neither, and the checkout needs both.
      - name: Install what the checkout needs
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git

      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the Linux installers
        uses: actions/download-artifact@v7
        with:
          name: linux-installers
          path: installers

      - name: Install the deb and start what it installed
        run: .github/scripts/package-smoke.sh installers/deb/*.deb installers/appimage/*.AppImage
